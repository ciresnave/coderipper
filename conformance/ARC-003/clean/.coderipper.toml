[architecture]
style = "layered"

[[architecture.component]]
name = "core"
paths = ["core"]
role = "policy"
volatility = "stable"

[[architecture.component]]
name = "backend"
paths = ["backend"]
role = "adapter"
volatility = "volatile"

[architecture.volatile]
names = ["BackendId"]
namespaces = ["sqlx::"]
feature_cfg_in_policy = true
