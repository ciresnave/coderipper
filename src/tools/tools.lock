# The tools CodeRipper may install, pinned (design section 8). One [[tool]] per tool and platform:
#
#   [[tool]]
#   name     = "gitleaks"                       # also the default file name inside the version directory
#   version  = "8.0.0"                          # exactly one version per tool and platform; there is no "latest"
#   platform = "x86_64-windows"                 # <arch>-<os>: x86_64|aarch64 - windows|linux|macos
#   source   = "https://example.com/gitleaks"   # https, http on this machine, or file://
#   sha256   = "<64 hex digits of that file>"
#   licence  = "MIT"                            # SPDX expression, shown by `coderipper tools list`
#   file     = "gitleaks"                       # optional; a .exe suffix is added on Windows
#
# Changing a line here is a reviewed change (a release of CodeRipper), never a run-time decision. The delegations that
# need tools (gitleaks, osv-scanner, lychee, zizmor, checkov, buf) add their entries with their PRs; gitleaks is the first.

# gitleaks 8.30.1 (MIT): SEC-002. Archive hashes are the ones in the publisher's gitleaks_8.30.1_checksums.txt (read 2026-10-09 from
# https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt); file_sha256 is the extracted
# executable's, computed from those verified archives. The release also has windows_arm64, windows_x32 and linux armv6/armv7/x32 builds, which are not pinned (CodeRipper does not run there yet).

