# Rule records, domain CON (concurrency and resource safety). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "CON-001"
title = "No data races"
domain = "CON"
statement = "Unsynchronised concurrent access to shared memory must be ruled out, either because the language guarantees it for safe code or because a race detector has exercised the concurrent paths in tests."
rationale = "Data races produce failures that vary from run to run and seldom show up in ordinary tests, so the guarantee has to come from the toolchain rather than from luck."
evidence_tiers = ["V0", "V2"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Keep shared state inside types the compiler can verify, or run the test suite under the platform's race or thread sanitizer and fix every report; treat a clean run as evidence, not proof."
related = ["CON-006"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-002"
title = "No lock held over a suspension point"
domain = "CON"
statement = "A mutex guard, a borrowed cell reference or a similar guard must not remain held while the task suspends or makes a call that blocks."
rationale = "Holding a guard while the task is suspended or blocked stalls every other task that wants the same lock and is a common route to deadlock."
evidence_tiers = ["V0", "V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "high"
confidence_class = "high"
kb_refs = []
remediation = "Shrink the critical section so the guard is dropped before the await, copy out what you need first, or switch to a lock designed to be held across suspension when that is truly required."
related = ["CON-003"]
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, build.rs, tests.rs-style files), items under cfg(test) and test functions (tokio::test too) skipped. A guard is X.lock(), X.read() or X.write() with no arguments (then optionally unwrap, expect, unwrap_or_else or ?), or X.borrow() / X.borrow_mut(), in an async fn, an async block or an async closure; one bound by let is held to the end of its block or to drop(g), a temporary to the end of its statement (through the body for match, if let, while let and for); an .await evaluated while a guard is held is reported at the acquisition (Medium severity, Medium confidence). An acquisition that is itself awaited (an async lock) is not a guard of this kind. Not judged: a guard reached through a helper, a trait method or a macro, the receiver's type, a guard the compiler proves dropped earlier in a branch, TypeScript and Python."

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "CON-003"
title = "No thread-blocking calls in async code"
domain = "CON"
statement = "Code running on an async executor must not call APIs that block the thread; such work belongs on a dedicated blocking pool."
rationale = "A blocked executor thread starves every other task scheduled on it, which shows up as latency spikes or apparent hangs."
evidence_tiers = ["V1", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Replace the blocking call with its async equivalent, or hand it to the runtime's blocking pool; stall detection in tests can catch what a list of known blocking APIs misses."
related = ["CON-002", "CON-008"]
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, build.rs, tests.rs-style files), items under cfg(test) and test functions (tokio::test too) skipped. In an async fn, async block or async closure (a closure that is not async is not read, since spawn_blocking and block_in_place take one): a call that resolves through the file's use items to std::thread::sleep, a function of std::fs, std::net::TcpStream::connect, an item of reqwest::blocking, std::process::Command::new(..) followed by .output() or .status(), or a .block_on(..) method call (Medium severity, Medium confidence). Not judged: blocking inside a helper the async code calls, a blocking API not on this list (a list of known names cannot see the rest; stall detection in tests can), glob imports, macros, other languages."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-004"
title = "Bounded queues, channels and spawns"
domain = "CON"
statement = "Every queue, channel, worker pool and spawn site has an explicit capacity, and the project says what happens when that capacity is reached."
rationale = "An unbounded buffer turns a slow consumer into memory exhaustion; a declared overflow policy forces a decision about backpressure, dropping or failing."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Give each queue a capacity and state in the specification whether a full queue blocks the producer, sheds load or returns an error; cap pool sizes the same way."
related = ["REL-003", "CON-008"]
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, build.rs, tests.rs-style files), items under cfg(test) and test functions (tokio::test too) skipped. A call that resolves through the file's use items to std::sync::mpsc::channel, tokio's unbounded_channel, futures::channel::mpsc::unbounded, crossbeam_channel::unbounded (or crossbeam::channel), flume::unbounded or async_channel::unbounded (Medium severity, Medium confidence); a channel given a capacity (sync_channel, tokio's mpsc::channel(n), bounded(n)) is not reported. Not judged: whether a stated overflow policy exists in the specification, queues that are not channels (a Vec or VecDeque used as one), worker pools and spawn sites with no capacity, other languages."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-005"
title = "No unsupervised detached tasks"
domain = "CON"
statement = "A spawned task keeps a handle or sits under a supervising scope that joins it, forwards its errors and can cancel it; a deliberately detached task needs a written justification."
rationale = "A task nobody owns can fail silently, outlive the work that started it, and leak resources at shutdown."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Keep the join handle and await it, spawn inside a task scope or set, or record in a comment why this task is allowed to run on its own."
related = ["CON-007", "CON-009"]
checked_today = "Tracked Rust files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) and test functions (any attribute ending in test, tokio::test included) skipped: a call of a free spawn function (tokio::spawn, task::spawn, task::spawn_local, spawn_blocking, thread::spawn, std::thread::spawn, async_std or smol spawn, or a bare spawn the file imports from one of them) whose handle is dropped on the spot, as a statement of its own or bound to an underscore. A handle kept in a variable, returned, pushed, awaited or joined, a spawn through a method (a JoinSet, a scope) and a spawn with a justifying comment (detach, fire-and-forget, background, on purpose, deliberate, intentional, supervis, owned by) on its line or in the three lines above are not reported. One Medium finding with Medium confidence per detached spawn; opt-in (check CON-005). Not judged: a kept handle that is never joined, a spawn through a wrapper of the project, a runtime handle method, whether the task forwards its errors, other languages."
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-006"
title = "No lock-order cycles"
domain = "CON"
statement = "Locks are always acquired in one consistent order, so no cycle of waiting threads can form."
rationale = "Two code paths taking the same locks in opposite orders can deadlock only under rare timing, which makes the bug hard to reproduce by hand."
evidence_tiers = ["V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "high"
confidence_class = "low"
kb_refs = []
remediation = "Document a lock hierarchy and follow it, then back it with a deadlock detector or schedule-permutation tests; passes are evidence only, since only the explored schedules were checked."
related = ["CON-001", "CON-002"]
lifecycle = "experimental"
checked_today = "Rust only, from the source (syn): a lock acquisition is X.lock(), X.read() or X.write() with no arguments whose receiver is self.field, self.a.b, self.shards[i] or a static; a guard held while another lock is acquired is an edge (a let-bound guard to the end of its block or drop, a temporary to the end of its statement); a cycle among the edges of the repository, or a lock taken while it is held, is a finding at Low confidence. Not judged: a lock reached through a local variable or a parameter, an edge made by a call, a guard moved into a function or closure, a macro body, ordering enforced by anything but the nesting, tests, benches, examples and vendored trees."

[rule.applicability]
languages = ["rust"]
scopes = ["first_party"]

[[rule]]
id = "CON-007"
title = "Deterministic release of resources"
domain = "CON"
statement = "Each acquired resource (file, socket, connection, task, buffer) is released predictably, including on error paths, and tests check that nothing is left open afterwards."
rationale = "Leaks accumulate quietly and show up as descriptor or memory exhaustion long after the faulty code ran."
evidence_tiers = ["V1", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Tie release to scope with RAII, defer, context managers or try-with-resources, and add counters for open descriptors, threads and tasks that tests compare before and after."
related = ["CON-005"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-008"
title = "Timeouts on externally dependent awaits"
domain = "CON"
statement = "An await whose completion depends on something outside the process carries a timeout or deadline, unless an exception is declared in the specification."
rationale = "Without a bound, one stalled peer can park a task forever and slowly consume the capacity of the whole service."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Wrap the operation in a timeout or pass a deadline down from the caller; list the few places where waiting indefinitely is intended."
related = ["REL-001", "CON-003"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-009"
title = "Cancellation safety is documented"
domain = "CON"
statement = "Async functions that keep partial state while suspended document what happens if they are cancelled midway, and that documentation has been reviewed."
rationale = "Cancellation can stop a future at any suspension point, leaving half-finished updates behind unless the author thought about it."
evidence_tiers = ["V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "State in the function's documentation whether dropping it midway is safe; restructure so state changes happen in one step after the last suspension, or protect them with a guard."
related = ["CON-005"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "CON-010"
title = "Weak atomic orderings are justified"
domain = "CON"
statement = "Any atomic operation using an ordering weaker than sequential consistency carries a comment that explains why that ordering is enough."
rationale = "Memory-ordering mistakes are subtle and platform dependent; the strongest ordering is the safe default, so a weaker one should be an argued choice."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Use the strongest ordering unless profiling shows a need, and write the reasoning next to each weaker one; model-check the algorithm where the stakes are high."
related = ["CON-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust"]
scopes = ["first_party"]

[[rule]]
id = "CON-011"
title = "Shared state has a declared owner"
domain = "CON"
statement = "Global statics, shared mutex-wrapped values, registries and singletons are listed in an inventory that names who owns each one."
rationale = "Shared mutable state is where races and lifetime confusion concentrate, so knowing who is responsible for it is a precondition for reasoning about it."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Extract the shared items from the code, declare an owner for each in the architecture description, and replace any that have no good reason to be shared with passed-in values."
related = ["CON-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]
