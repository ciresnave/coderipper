# Rule records, domain RDB (readability and dead weight). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "unused-parameters"
title = "A parameter the function never uses"
domain = "RDB"
statement = "A function parameter that the body never reads is dead weight in the signature, apart from the ones a trait forces on an implementation."
rationale = "An ignored parameter misleads callers about what the function depends on and has to be supplied at every call site for nothing."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "low"
confidence_class = "high"
kb_refs = ["RDB-006"]
aliases = []
remediation = "Remove the parameter, or prefix it with an underscore if the signature is imposed from outside."
related = ["unused-return-values", "reachability"]
lifecycle = "advisory"

[rule.applicability]
languages = ["rust"]
scopes = ["first_party"]

# Rule records, domain RDB (readability and naming). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "RDB-001"
title = "Code matches the project formatter"
domain = "RDB"
statement = "Every source file is exactly what the project's chosen automatic formatter would produce."
rationale = "Settling layout by machine ends arguments over style and keeps diffs about substance rather than whitespace."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "high"
kb_refs = []
remediation = "Run the formatter over the tree and commit the result; run it in check mode in CI so drift fails fast."
related = []
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-002"
title = "Identifiers follow language naming conventions"
domain = "RDB"
statement = "Names of variables, functions, types and constants follow the conventions of their language and of the project."
rationale = "Readers rely on casing and shape to tell kinds of things apart; a house style that deviates costs attention everywhere."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "high"
kb_refs = []
remediation = "Rename offenders to the language convention, and enable the naming lints so new ones are caught on entry."
related = ["RDB-011"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-003"
title = "Cognitive complexity stays within bounds"
domain = "RDB"
statement = "Function cognitive complexity should stay under a warning level near 15 and an error level near 30, and a function being edited should not become more complex than it was."
rationale = "Cognitive complexity tracks how hard code is to understand better than path counting does, so it is a usable proxy for reading effort."
evidence_tiers = ["V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Flatten the control flow by exiting early on the failure cases, and pull out pieces that deserve a name. Generated code, parsers and state-machine implementations may be exempted with a recorded reason."
related = ["RDB-004", "RDB-013"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-004"
title = "Nesting, parameter count and flag arguments stay small"
domain = "RDB"
statement = "Functions keep nesting shallow, take a modest number of parameters, and avoid boolean flag arguments that switch behaviour."
rationale = "Deep nesting and long or flag-laden signatures are classic smells that raise reading effort and invite call-site mistakes. Treat any numeric limit as a signal, not a verdict."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Use early exits to cut nesting, group related parameters into a type, and replace a flag with two functions or an enum."
related = ["RDB-003", "TYP-007"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-005"
title = "Duplicated knowledge across clone groups"
domain = "RDB"
statement = "Clone groups above a minimum size are reported, weighted by how often the copies change, so that one fact is not maintained in several places. Copies that merely look alike by chance may be waived."
rationale = "When the same decision lives in several spots, a fix to one leaves the others wrong. Similar text that expresses unrelated ideas is not a real duplication, and merging it creates a bad abstraction."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Merge copies that carry the same knowledge into one definition; note a justified exemption for look-alikes that are independent."
related = ["RDB-013"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-006"
title = "No dead code, unused imports or unused private items"
domain = "RDB"
statement = "Nothing in the tree is unreferenced: no unused imports, locals, private functions or private types."
rationale = "Dead code still has to be read, maintained and reasoned about, and it misleads about what the system does."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "high"
kb_refs = []
remediation = "Delete the unused item; in a dynamic language, confirm it is not reached by reflection or a string lookup first."
related = ["unused-parameters", "reachability"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-007"
title = "Magic literals get names"
domain = "RDB"
statement = "Bare numeric or string literals whose meaning is not obvious are replaced by named constants or dedicated types."
rationale = "A literal like 86400 says nothing about intent and, when repeated, is easy to change in one place only."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "info"
confidence_class = "low"
kb_refs = []
remediation = "Introduce a named constant or a small type that states the meaning. Obvious values such as 0 or 1 in context need no name."
related = ["TYP-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-008"
title = "Comment hygiene: owned TODOs, no commented-out code"
domain = "RDB"
statement = "Each TODO names an owner and a date or ticket by which it expires, and code that has been commented out is deleted rather than kept."
rationale = "Anonymous to-dos never get done, and disabled code rots while the version history already preserves it."
evidence_tiers = ["V0", "V1"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Add an owner and expiry to the TODO or resolve it; delete the commented-out block."
related = ["RDB-010"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-009"
title = "Names tell the truth about behaviour"
domain = "RDB"
statement = "Whatever a function or type is called, it behaves that way, and that includes any side effects."
rationale = "A misleading name makes callers rely on behaviour that is not there, a defect no compiler catches."
evidence_tiers = ["V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Rename to describe the real behaviour, or change the code to honour the name; split out an effect the name hides."
related = ["RDB-002", "EFX-005"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

