# Rule records, domain RDB (readability and dead weight). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "unused-parameters"
title = "A parameter the function never uses"
domain = "RDB"
statement = "A function parameter that the body never reads is dead weight in the signature, apart from the ones a trait forces on an implementation."
rationale = "An ignored parameter misleads callers about what the function depends on and has to be supplied at every call site for nothing."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "low"
confidence_class = "high"
kb_refs = ["RDB-006"]
aliases = []
remediation = "Remove the parameter, or prefix it with an underscore if the signature is imposed from outside."
related = ["unused-return-values", "reachability"]
lifecycle = "advisory"

checked_today = "Rust only. In a throwaway worktree of the committed tree (HEAD: uncommitted edits are not seen) cargo check builds all targets with lints capped to warnings, and rustc's own unused_variables diagnostics are kept only where they land exactly on a parameter (found with syn, in src/ or the package's cargo target roots) of a free function, nested ones included, or of an inherent-impl method. A local, a closure parameter, a trait declaration, a trait default body, a trait impl method (its signature is the trait's) and anything inside a macro_rules body are not reported. One finding per parameter: Low severity, High confidence, subject the qualified function and the parameter. A name that starts with _ is never reported (that is the way to silence it) and an item-level #[allow(unused_variables)] is respected. Parameters in tests/, examples/ and benches/ are built but not reported. A sentinel parameter is injected into each target root as a control: the run is an error, never clean, when rustc does not report it (a crate-wide allow of unused or unused_variables) or the build has compiler errors; a [[bin]] whose required-features are off is named as not checked. Runs in the classic, extended and portfolio profiles at the fast tier, and is advisory (it never blocks). It builds the project, so its build scripts and procedural macros run. Not judged: other languages, a parameter deliberately ignored under a _ name, the parameters of a trait's own methods, code under a cfg that this build does not enable, and a parameter that is only passed along (it counts as used)."

[rule.applicability]
languages = ["rust"]
scopes = ["first_party"]

