[[rule]]
id = "RDB-003"
title = "Cognitive complexity stays within bounds"
domain = "RDB"
statement = "Function cognitive complexity should stay under a warning level near 15 and an error level near 30, and a function being edited should not become more complex than it was."
rationale = "Cognitive complexity tracks how hard code is to understand better than path counting does, so it is a usable proxy for reading effort."
evidence_tiers = ["V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Flatten the control flow by exiting early on the failure cases, and pull out pieces that deserve a name. Generated code, parsers and state-machine implementations may be exempted with a recorded reason."
related = ["RDB-004", "RDB-013"]
checked_today = "Rust, from the source with syn (opt-in): SonarSource's Cognitive Complexity (G. Ann Campbell, 2017) of every function with a body (free, method, trait default method, nested function), outside vendored directories, tests, examples, benches, build.rs, cfg(test) items, #[test] functions and files that say they are generated. +1 plus the nesting level for an if, if let, match, for, while and loop; +1 for each else and else if; +1 for each sequence of like logical operators (a && b || c is two); +1 for a labelled break or continue; +1 for a direct recursive call; nesting rises by one inside an if, else, match arm, loop body and closure body. One finding per function over 15 (Low severity) and over 30 (Medium), at the function name, Medium confidence. Not judged: the record's second half (a function being edited should not become more complex: needs a baseline at the merge base), the ? operator and let-else (not counted, as in the measure), macro bodies (syn does not read their tokens), generated code that does not say so, other languages. Parsers and state machines score high by nature: allow them with a reason."
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-004"
title = "Nesting, parameter count and flag arguments stay small"
domain = "RDB"
statement = "Functions keep nesting shallow, take a modest number of parameters, and avoid boolean flag arguments that switch behaviour."
rationale = "Deep nesting and long or flag-laden signatures are classic smells that raise reading effort and invite call-site mistakes. Treat any numeric limit as a signal, not a verdict."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Use early exits to cut nesting, group related parameters into a type, and replace a flag with two functions or an enum."
related = ["RDB-003", "TYP-007"]
lifecycle = "experimental"

checked_today = "Rust only (the catalog says any language; the others are not read), opt-in (runs when named, in no profile): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) and test functions skipped. Per function, one Low finding at medium confidence for each of: more than 7 parameters, self not counted (not read in trait impls, whose signature the trait dictates); control flow nested 5 or more deep (if, match, loop, while, for; an else if shares its if's level; closures add none; read in trait impls too); a bool parameter that the body uses directly as an if or while condition or a match scrutinee (if flag, if !flag; not read in trait impls). Not judged: macro bodies, generated code, a bool behind a type alias, a flag copied into a variable first, shadowed names, long but flat functions, TypeScript and Python."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "RDB-005"
title = "Duplicated knowledge across clone groups"
domain = "RDB"
statement = "Clone groups above a minimum size are reported, weighted by how often the copies change, so that one fact is not maintained in several places. Copies that merely look alike by chance may be waived."
rationale = "When the same decision lives in several spots, a fix to one leaves the others wrong. Similar text that expresses unrelated ideas is not a real duplication, and merging it creates a bad abstraction."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Merge copies that carry the same knowledge into one definition; note a justified exemption for look-alikes that are independent."
related = ["RDB-013"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

