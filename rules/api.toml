# Rule records, domain API (API evolution). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "API-001"
title = "Breaking public changes since last release"
domain = "API"
statement = "Comparing the public interface against the last release finds no incompatible change that has not been declared as breaking."
rationale = "Consumers rely on a published interface as a promise, and tool-detectable breakage is cheap to catch before it ships."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Restore compatibility, or release the change as a breaking one with the version bump and notice that implies."
related = ["API-003", "API-002"]
lifecycle = "experimental"

checked_today = "The crate at the working tree (or, when the root Cargo.toml has a [workspace] table, every library of the workspace) is compared by cargo-semver-checks (check-release) with a baseline taken from git, not from crates.io: the newest release tag reachable from HEAD (v1.2.3 or 1.2.3, no pre-release), else the merge-base of HEAD with origin/HEAD, origin/main or origin/master. Each failed lint item is a finding (a removed or renamed public item, a changed signature, ...), High severity and Medium confidence, placed where the item was in the baseline. A break released with the version bump it needs (the major, and before 1.0 the second number) is not a failure. Runs in the extended profile only. The tool builds both sides with cargo rustdoc, so the project's build scripts and procedural macros run and cargo may download dependencies. Not run (a reported gap, never clean): cargo-semver-checks not installed or no pinned build for the platform, no Cargo.toml at the project root, no git commit, no release tag and no origin default branch (or a shallow clone without the merge-base), and a crate with no library target. A tool failure or an unreadable report is an error. Not judged: Python and TypeScript, public surfaces that are not Rust items (HTTP, Protocol Buffers: see API-006), behaviour changes that keep the signature, anything the tool has no lint for, and whether a break was announced in a changelog or notice."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-002"
title = "Public surface snapshot reviewed when changed"
domain = "API"
statement = "The public interface is recorded in a snapshot file, and any change to that snapshot is surfaced for review."
rationale = "Accidental exposure is common; a visible diff makes every widening or narrowing of the interface an explicit decision."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "low"
confidence_class = "high"
kb_refs = []
remediation = "Regenerate the snapshot and have a reviewer approve the interface difference."
related = ["API-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-003"
title = "Version number matches kind of change"
domain = "API"
statement = "The version bump in a release is at least as large as the kind of change detected: major for breaking, minor for additions. Before 1.0 the second number plays the major role (0.5.x to 0.6.0 is a breaking change) and the third the minor."
rationale = "Version numbers are how consumers decide whether an upgrade is safe, so a mismatch silently misleads them."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Raise the version to the level the detected change requires, or remove the change that forces it."
related = ["API-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-004"
title = "Deprecation notices carry full lifecycle data"
domain = "API"
statement = "Each deprecation states the version it began in, what replaces the item, and when removal is planned."
rationale = "A bare deprecation tells consumers to worry but not how or when to act, so migration stalls."
evidence_tiers = ["V0", "V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Add the since-version, the replacement, and the removal target to the deprecation notice."
related = []
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories and outside binary roots (main.rs, src/bin/); an item is public when its visibility is a bare pub and every inline module above it is pub (a pub use or a module in its own file is not followed); cfg(test) items, test functions and doc(hidden) items are skipped; methods are the pub methods of inherent impl blocks of types not private in the same file. Reports a #[deprecated] attribute with no since or no note (Low severity, Medium confidence). Not judged: whether the note names a replacement or a removal date, deprecation by doc text, other languages."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-005"
title = "Serialized formats tested for old and new readers"
domain = "API"
statement = "Persisted and wire formats have tests showing that older data still reads in newer code and, where policy requires, the reverse."
rationale = "Data outlives the code that wrote it, and a format change that strands stored data is hard to undo."
evidence_tiers = ["V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Add stored sample files and write-then-read tests across the supported versions."
related = ["API-006"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-006"
title = "Schema changes obey evolution rules"
domain = "API"
statement = "Changes to schemas never reuse or retype a field, and never add a new required field to an existing message."
rationale = "Those changes make old and new participants misread each other's data without any visible error."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "high"
kb_refs = []
remediation = "Add a new field instead, mark the old one retired, and keep its identifier reserved."
checked_today = "The working tree's Protocol Buffers schemas (.proto files the repository tracks, in the buf modules its buf.yaml / buf.work.yaml files name, else the project directory; not those below node_modules, vendor, third_party or target) are compared by buf (`buf breaking`, category FILE) with a baseline: the git ref named by [buf] baseline in .coderipper.toml, else the merge-base of HEAD with origin/HEAD (origin/main, origin/master). Every violation buf reports is a finding (retyping or renumbering a field, removing a field, message, enum value or file, moving a message to another package, ...). The repository's own buf.yaml (its breaking ignore lists and rule selection, at the tree and at the baseline) is not honoured. Not judged, and then the rule is a gap and never clean: a run with no baseline (no origin, a shallow clone without the merge-base), a run on the default branch with a clean tree (the baseline is the tree's own commit), a run where no .proto file differs from the baseline, changed .proto files that are not below a buf module with schema on both sides, a baseline with no .proto file, a tree whose every schema was removed, and a module that had schema in the baseline and has none now (buf cannot compare it); a .proto file buf cannot compile (a missing import, including a Buf Schema Registry dependency, or a syntax error) stops buf from judging any file (it builds all of the schemas or none), so the rule is a gap then. Not judged: schema formats other than Protocol Buffers (Avro, JSON Schema, OpenAPI, GraphQL), buf's lint and WIRE or WIRE_JSON categories, and a field's use in code (whether a retyped field was in use is not known)."
related = ["API-005"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-007"
title = "Database migrations safe step by step"
domain = "API"
statement = "Each migration step is non-destructive, aware of locking, and still works with the previous version of the application."
rationale = "Deployments overlap old and new code, so a step that breaks either side causes downtime or data loss during rollout."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Split the change into expand, backfill, switch and contract steps, each safe on its own."
related = []
lifecycle = "experimental"

checked_today = "The tracked PostgreSQL migration files (from git ls-files: .sql files below a directory named migrations, migration, migrate or migrates, or named like a versioned migration, V12__name.sql or 20260101120000_name.sql; not below node_modules, vendor, third_party, target or .git; files over 4 MiB skipped) are linted by squawk, run with its style rules switched off (prefer-robust-stmts, prefer-bigint-over-int, prefer-bigint-over-smallint, prefer-identity, prefer-text-field, prefer-timestamptz, require-lock-timeout, require-statement-timeout) and with the repository's .squawk.toml not read. One finding per squawk finding at the file and line, Medium confidence: High for a dropped column, table or database, a truncate cascade, a changed column type, a renamed column or table, and a NOT NULL column added without a default; Medium for every other squawk rule (locking and transaction advice, such as an index built without CONCURRENTLY or a constraint added without NOT VALID). A -- squawk-ignore comment in a migration is honoured by squawk and cannot be switched off, so the findings carry a note counting them. Runs in the extended profile only. Not run (a reported gap, never clean): squawk not installed or no pinned build for the platform, no tracked migration file, and a clean result when squawk could not parse a statement (reported as not judged). A tool failure is an error. Not judged: dialects other than PostgreSQL (MySQL, SQLite, SQL Server, Oracle), migrations kept in other forms (Rails or Django migration code, an XML or YAML changelog) or outside the naming above, whether the previous version of the application still works with each step, the order of steps across migrations, and table size (so whether a lock matters)."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-008"
title = "Public API exposes no third-party types"
domain = "API"
statement = "Public signatures do not name types from other libraries unless the project has declared the exception."
rationale = "Exposing another library's types ties your version policy to theirs, so their breaking change becomes yours."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Wrap the type in your own, or record the exposure as a deliberate, declared exception."
related = []
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "API-009"
title = "Extension points flagged on exported enums and structs"
domain = "API"
statement = "Public enums and structs expected to gain members are marked so that adding them is not a breaking change."
rationale = "Without the marker, extending the type forces a major version, which discourages healthy growth."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Mark the type as non-exhaustive or sealed, or document that it is intentionally closed."
related = []
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories and outside binary roots (main.rs, src/bin/); an item is public when its visibility is a bare pub and every inline module above it is pub (a pub use or a module in its own file is not followed); cfg(test) items, test functions and doc(hidden) items are skipped; methods are the pub methods of inherent impl blocks of types not private in the same file. Reports a pub enum with variants, or a pub struct whose named fields are all pub, with no #[non_exhaustive] and no doc that says the type is closed (the words exhaustive, closed, sealed, fixed set) (Low severity, Medium confidence). Not judged: whether the type is expected to grow, sealed traits, other languages."

