# Rule records, domain TYP (domain modelling and types). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "TYP-001"
title = "Public APIs wrap domain values in dedicated types"
domain = "TYP"
statement = "Public signatures use dedicated types, not raw numbers or strings, for identifiers, money, units and durations."
rationale = "A bare integer can be an id, a count or a price, and the compiler cannot tell a swapped pair of arguments apart."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Introduce a newtype or branded type for the concept, but only where confusion is plausible or an invariant exists."
related = ["MOD-010", "TYP-005", "RDB-007"]
checked_today = "Rust, from the source with syn: tracked .rs files of a library outside vendored directories, tests, examples, benches, build.rs, main.rs and src/bin, and outside cfg(test) and doc(hidden) items. A public function (a free function, a pub method of an inherent impl, a method of a pub trait; not the methods of impl Trait for Type) is reported once, at its signature, when a parameter is named for a domain value and typed as a bare primitive. Three classes by the snake_case segments of the name: money (price, amount, money, cost, balance, fee, salary) typed as a float or an integer; duration (duration, timeout, ttl, delay) typed as a float or an integer; identifier (the last segment is id) typed as an integer, String, &str or &String. A name that states its unit is not reported (timeout_ms, amount_cents, and the segments ms, millis, secs, seconds, minutes, hours, days, micros, nanos, us, ns, sec, cents, pence, minor). An identifier is reported only where a swap is plausible: two identifier parameters of the same primitive type in one signature, which the compiler cannot tell apart; a lone id: &str, or ids of different types, are not reported. Money and duration are reported alone. Not judged: return types, struct fields, a type alias that hides the primitive, a newtype that is itself a bare wrapper, other words, other languages, whether confusion is really plausible (the record asks for it, a name cannot know). Low severity, Low confidence; default on in extended and portfolio, advisory."
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-002"
title = "Strings standing in for enums"
domain = "TYP"
statement = "When code branches on text such as \"pending\" or \"done\", or on a set of flags that together name a mode, the choices belong in an enum or union so that a typo cannot compile and a new case gets noticed."
rationale = "A misspelt literal compiles and fails at run time, and nothing forces every branch to handle a new state."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Define an enum or union of the legal values and switch over it exhaustively."
related = ["TYP-009"]
checked_today = "Tracked Rust files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) and test functions skipped; a site is a match whose arms carry three or more distinct string-literal patterns, or an if / else if chain whose conditions compare something to three or more string literals (also through ||), reported once at the match or the first if. Not reported: the body of a function named from_str, try_from or from (turning outside text into a typed value is where a string match belongs), fewer than three literals, matches! and other macro bodies, other languages. Not judged: whether the strings are a closed set or a lookup of data, strings compared through a helper, constants as patterns. One finding per site with Medium confidence; Low severity; opt-in (check TYP-002)."
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-004"
title = "Outside data becomes domain types at the boundary"
domain = "TYP"
statement = "Core logic should only ever see values that have already been converted from raw input into domain types; the conversion, with its checks, happens where the data first enters the program."
rationale = "Parsing once at the edge means the interior works only with values that are valid by construction, rather than re-checking them repeatedly."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Add a parsing step at the point of entry that returns a validated domain type, and pass that type inward."
related = ["MOD-010", "TYP-008"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-005"
title = "Money and exact amounts avoid binary floats"
domain = "TYP"
statement = "Money and other quantities needing exact arithmetic use whole numbers of the smallest unit, or a decimal type, rather than float types."
rationale = "Binary floating point cannot represent many decimal fractions exactly, so sums drift and comparisons surprise."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Store amounts as integers of the smallest unit or in a decimal type, and wrap them in a money type."
related = ["TYP-001"]
checked_today = "Tracked Rust files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) skipped: a named struct or enum-variant field, a function or method parameter, a let binding with a type annotation, or a function return whose name has a word price, cost, balance, fee, salary, wage, payment, amount, money, revenue or charge (a plural counts) and whose type, as written, is f32 or f64 (also inside Option, Vec, a reference or a tuple). A name with a word such as rate, ratio, percent, factor, scale, weight or score is left out. One Medium finding with Low confidence per site; opt-in (check TYP-005). Not judged: a float under a name that does not say money, a type alias for a float, an inferred binding, a generic later instantiated with a float, other languages."
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-006"
title = "No unwrap or null assertions on production paths"
domain = "TYP"
statement = "Production code does not call unwrap, expect or a non-null assertion on a value that can legitimately be absent, except where an invariant is justified in writing."
rationale = "These operations turn a missing value into a crash at a distance from its cause."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "high"
kb_refs = []
remediation = "Handle the absent case explicitly, propagate it, or document the invariant that makes it impossible."
related = ["TYP-008"]
lifecycle = "experimental"

checked_today = "Rust only (the catalog also names TypeScript non-null assertions and other languages, which are not read): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) or test skipped. A method call unwrap() with no argument or expect(arg) with one argument is a site; a site is justified when a comment on the same line, up to the end of the statement, or alone on the line above begins with INVARIANT, SAFETY or UNWRAP-OK, or when an expect message says why it cannot fail (it contains invariant, always, never, cannot, guaranteed, validated, checked or by construction). A file with at least one unjustified site gets one Medium finding at high confidence, naming the first site and the count; opt-in, run by naming the id, because it fires widely. unwrap_or, unwrap_or_else, unwrap_or_default, unwrap_err and expect_err are not sites. Not judged: other languages, whether the receiver is a Result, an Option or a type with its own unwrap method (syn has no types), calls inside macro tokens, whether a stated invariant is true."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-007"
title = "Boolean blindness in signatures"
domain = "TYP"
statement = "Functions are not given several boolean parameters, and do not return a bare boolean whose meaning is unclear."
rationale = "At a call site true and false carry no meaning, so arguments are easily swapped and results misread."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "medium"
kb_refs = []
remediation = "Replace the booleans with enums or separate functions, and return a descriptive type instead of a bare flag."
related = ["RDB-004"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-008"
title = "Invariants are written down and checked"
domain = "TYP"
statement = "Each important invariant is written down and also enforced by a type, an assertion or a property test."
rationale = "An invariant that is only a comment gets violated, and one that is only enforced is a puzzle for the next reader."
evidence_tiers = ["V1", "V2", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Document the invariant next to the type and add the check that guarantees it; make the two agree."
related = ["MOD-010", "TYP-006"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "TYP-009"
title = "State machines make transitions explicit"
domain = "TYP"
statement = "State machines list their legal transitions; an illegal move is either impossible to express or rejected."
rationale = "Implicit transitions let the system drift into states nobody designed for."
evidence_tiers = ["V0", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Encode states as a sum type with exhaustive matching, or keep a transition table that tests exercise."
related = ["TYP-002"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]
