network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Add or fix an index, or rewrite the query so the planner can use one."
related = []
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
