title = "Performance exceptions documented with benchmark link"
domain = "PRF"
statement = "A deviation from normal structure made for speed carries a marker linking to the benchmark that justified it."
rationale = "Unexplained ugly code gets cleaned up and slows down again, or is kept forever after the reason has gone."
evidence_tiers = ["V1", "V4"]
