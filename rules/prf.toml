# Rule records, domain PRF (performance). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "PRF-001"
title = "Hot paths have budgets enforced by benchmarks"
domain = "PRF"
statement = "Code paths designated as performance-critical have a stated budget, checked by benchmarks that run in CI."
rationale = "A requirement nobody measures drifts; budgets make regressions visible while they are still cheap to fix."
evidence_tiers = ["V2"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Declare the budget in the specification and add a benchmark that fails when it is exceeded."
related = ["PRF-002"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "PRF-002"
title = "Statistically detected benchmark regressions"
domain = "PRF"
statement = "A slowdown in changed code is reported only when a significance test and a threshold tuned to the measured noise both call it real, judged against a stored baseline."
rationale = "Raw timing differences are mostly noise; only a proper comparison separates a real slowdown from jitter."
evidence_tiers = ["V2"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Adopt benchmark comparison tooling with a threshold tuned to the measured noise."
related = ["PRF-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "PRF-003"
title = "Algorithmic red flags in code"
domain = "PRF"
statement = "Code avoids patterns that signal accidental super-linear cost: nested scans of one collection, repeated concatenation, cloning inside loops, and per-row queries."
rationale = "Such shapes behave well on small test data and collapse at production scale, where they are expensive to find."
evidence_tiers = ["V1", "V2"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Replace the pattern with an indexed lookup, a single pass, a builder, or one batched query."
related = ["PRF-004"]
lifecycle = "experimental"

checked_today = "Rust only (the catalog says any language; the others are not read), opt-in (runs when named, in no profile): tracked production .rs files (outside vendored, fixture and development directories, tests, benches, examples, tools, build.rs, tests.rs-style files and files over 2 MiB, which a note names), parsed with syn, items under cfg(test) and test functions skipped. Per function, one Medium finding at low confidence at the first site, with the sites listed, for four shapes read inside a loop (a for, while or loop, or the closure given to an iterator adaptor such as map, for_each or filter on an iterator): a linear search (contains, or iter().any, iter().find, iter().position, iter().rposition) of a Vec, VecDeque, slice or array declared outside the loop, whose type is read from a typed parameter, a typed or constructed let (Vec::new, vec!, collect::<Vec<_>>, to_vec) or a field of the same file; s = format!(.. s ..) where s is declared outside the loop; a query, query_as, query_scalar, query_row, query_one, query_opt, query_map, query_and_then, simple_query, prepare or prepare_cached call with a string literal that starts with SELECT; and a copy made only to be read: clone, to_vec or to_owned of a Vec, VecDeque, slice, String, HashMap, HashSet, BTreeMap, BTreeSet or BinaryHeap declared outside the loop whose result is only looked at (iter, len, is_empty, contains, get, first, last, join, chars and the like) or is what a for inside another loop iterates; a clone handed on (pushed, returned, put in a struct) is not read. The closures of map_err, ok_or_else, unwrap_or_else and or_else run on a failure path and are not read. Not judged: other languages; a type the rule cannot read from a declaration (a returned collection, an inferred closure parameter, a field of another file); a search hidden in a called function; INSERT, UPDATE or DELETE per row (only SELECT is read); string building with + (amortised in Rust); whether the loop or the collection is large; macros; whether a clone is needed."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "PRF-004"
title = "Hot loops tagged for speed allocate nothing"
domain = "PRF"
statement = "Loops tagged as hot allocate no memory per iteration."
rationale = "Allocation in the innermost loop adds latency and contention, but only the tagged loops justify the effort of avoiding it."
evidence_tiers = ["V1", "V2"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Hoist or reuse buffers outside the loop, and confirm the gain with an allocation counter."
related = ["PRF-003"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "PRF-005"
title = "Caches and collections lacking growth bounds"
domain = "PRF"
statement = "Caches have an eviction policy and collections that accept external input have a size limit."
rationale = "Unbounded growth turns a long-running process into a slow memory leak or an easy denial-of-service target."
evidence_tiers = ["V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Add an eviction policy or a hard capacity, and decide what happens when the limit is hit."
related = []
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
