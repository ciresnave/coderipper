title = "Critical query plans avoid full table scans"
domain = "PRF"
statement = "Queries declared critical have tests inspecting their execution plans for full scans."
rationale = "A missing index shows up only on large data, so a plan test catches it before production does."
evidence_tiers = ["V2"]
