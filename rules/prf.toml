confidence_class = "low"
kb_refs = []
remediation = "Add a marker next to the deviation that links to the benchmark evidence."
related = []
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
