# Rule records, domain ERR (errors). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "unused-return-values"
title = "A return value every caller discards"
domain = "ERR"
statement = "A function whose result is thrown away at every call site either returns something nobody needs or hides a result callers should be checking."
rationale = "A value computed and always ignored is wasted work at best; at worst it is an error or status that no caller ever looks at."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
# medium is the severity when every caller discards the value; a partial discard is reported lower
default_severity = "medium"
confidence_class = "medium"
kb_refs = ["ERR-001", "ERR-011"]
aliases = []
remediation = "Stop returning the value, or make the callers use it; if discarding it is deliberate, allowlist the function with the reason."
related = ["unused-parameters"]
lifecycle = "advisory"

checked_today = "Rust only. In a throwaway worktree of the committed tree (HEAD: uncommitted edits are not seen) each eligible function in src/ (or in the package's cargo target roots when it has no src/) is tagged with #[must_use] and #[deprecated], cargo check builds all targets, and rustc's unused_must_use reports (a call whose value is dropped) are counted against its deprecated reports (every use), so calls from tests, examples and benches count as uses. Eligible: free functions, inherent methods and trait method declarations whose return type is not absent, (), !, a Result (rustc already warns) or &mut Self, and that are not async, extern, main, #[test], #[bench], #[must_use], #[deprecated], proc-macro or no_mangle functions, and do not hand back a closure's result (fn with<T>(f: impl FnOnce() -> T) -> T); trait impl methods are not tagged, their trait declaration is. One finding per function with at least one discarded call: Medium severity when every call site discards the value, Low when only some do, Medium confidence. let _ = f(); and _ = f(); count as a use (a deliberate discard), an import is not a call, and a recursive call is not a caller. A function that is never called is not reported. A sentinel function is injected as a control: the run is an error, never clean, when it is not seen by both lints (a crate-wide allow of deprecated or unused_must_use) or the build has compiler errors. Runs in the classic, extended and portfolio profiles at the fast tier, and is advisory (it never blocks). It builds the project, so its build scripts and procedural macros run. Not judged: other languages, functions defined inside a macro_rules body, calls hidden in macros the lints do not see through, calls from other crates, and whether a discarded value matters (the finding says it is never consumed, not that this is wrong)."

[rule.applicability]
languages = ["rust"]
scopes = ["first_party"]

[[rule]]
id = "ERR-001"
title = "Errors are not swallowed"
domain = "ERR"
statement = "A failure result must be looked at: no empty catch blocks, no bare except that passes, no ignored Result values, and no underscore binding that discards a fallible call without a stated reason."
rationale = "When a failure vanishes silently the program carries on in a state nobody checked, and later symptoms cannot be traced back to the cause."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "high"
kb_refs = []
remediation = "Handle the failure, propagate it to the owner, or record in a comment why dropping it is safe at that exact spot."
related = ["ERR-011", "unused-return-values"]
lifecycle = "experimental"

checked_today = "Rust only (the catalog also names TypeScript and Python, which are not read): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) or test and impl Drop blocks skipped. Five ways of dropping a failure are reported at Medium severity and Medium confidence, one finding per site: let _ = call(); _ = call(); call().ok(); as a statement; an Err(_) => {} arm; and if let Ok(..) = call with no else when the call is on a short named list (file-system, file, socket and Command calls, read, write and flush methods). A comment on the same line, up to the end of the statement, or alone on the line above is the stated reason this rule asks for and silences the site (the opposite of lint-suppression). A bare call(); whose Result is discarded is the legacy check unused-return-values. Not judged: other languages, whether the dropped value is a Result at all (syn has no types), a drop through a macro, a function that swallows internally."

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-002"
title = "Catch-all handlers only at boundaries"
domain = "ERR"
statement = "Handlers that catch every kind of failure belong only in a short list of designated outermost functions, such as a request loop or task runner."
rationale = "A catch-all deep inside the code masks causes that should surface and turns distinct bugs into one indistinguishable outcome."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Narrow the handler to the failures it can truly deal with, or move the catch-all up to a declared boundary function."
related = ["ERR-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-003"
title = "No panics or unchecked indexing on input paths"
domain = "ERR"
statement = "Code that can be reached from external input should not panic, unwrap without a check, or index into data without bounds handling."
rationale = "Anyone who controls the input can then crash the process or a worker, which is both a reliability and a denial-of-service problem."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Return a typed error for bad input, use checked accessors, and reserve unwrap or expect for invariants with a written justification."
related = ["ERR-004"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-004"
title = "Library errors are typed so callers can match them"
domain = "ERR"
statement = "Public functions in libraries report failure through specific error types a caller can branch on, not through plain strings, boxed dynamic errors, or the base exception class."
rationale = "Callers that must parse message text to decide what to do break whenever the wording changes, so the error shape is part of the API contract."
evidence_tiers = ["V1"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Define an enum or exception hierarchy for the library's failures and return it from public functions; let applications wrap it with context."
related = ["ERR-005", "ERR-003"]
lifecycle = "experimental"

checked_today = "Rust only, from the source (syn): tracked .rs files outside vendored, fixture and development directories and outside binary roots (main.rs, src/bin/); an item is public when its visibility is a bare pub and every inline module above it is pub (a pub use or a module in its own file is not followed); cfg(test) items, test functions and doc(hidden) items are skipped; methods are the pub methods of inherent impl blocks of types not private in the same file. Reports a pub fn returning Result whose error is String, &str, Box<dyn ..>, anyhow::Error or eyre::Report, or anyhow::Result (Medium severity, Medium confidence). Not judged: a type alias that hides the error, a library that only wraps another's typed error, TypeScript and Python."

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-005"
title = "Cross-boundary errors keep context and cause"
domain = "ERR"
statement = "When a failure crosses from one component to another it is wrapped with what was being attempted and the original cause stays attached."
rationale = "Without the operation, resource and underlying cause, an incident responder cannot tell where a failure began or why."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Wrap the error at the boundary with a message naming the operation and resource, and chain the original error as its cause."
related = ["ERR-004", "ERR-001"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-006"
title = "Domain errors free of transport details"
domain = "ERR"
statement = "Error types that belong to the domain layer must not mention HTTP status codes, database driver errors, or other details of how the failure is delivered."
rationale = "Transport vocabulary in the core couples business logic to one delivery mechanism and leaks internals to callers."
evidence_tiers = ["V0"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Keep domain errors in domain terms and translate them to status codes or driver-specific forms in the adapter at the edge."
related = ["ARC-004"]
checked_today = "Rust workspaces with an [architecture] table that has a policy component (role = policy, or no role and volatility = stable); a repository that declares none gets not run, never clean. For each policy component, in the library of each of its crates at HEAD (test items skipped), every public error type, a struct or enum whose name ends in Error: its public fields and its variant fields, the types they name resolved through the module use declarations. A path is a transport detail when it is infrastructure for ARC-004 (a namespace or name in [architecture.volatile], [arc004] patterns, a crate of a volatile, adapter or infrastructure component), or starts with a namespace this rule always counts as transport or driver: http, hyper, axum, actix_web, warp, rocket, tonic, reqwest, tower_http, sqlx, diesel, sea_orm, tokio_postgres, postgres, rusqlite, mysql, mysql_async, redis, mongodb, rdkafka, lapin. One finding per Type::Variant or Type.field site, naming every transport type; Low severity, Low confidence; default on in extended and portfolio, advisory (the portfolio profile only reports it). Not judged: an error type whose name does not end in Error, methods of an error type, a type alias or re-export that hides the origin, macro-generated items (a thiserror #[from] field is read, the generated impl is not), glob imports, module-path components (noted, only whole crates judged).";
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "ERR-007"
title = "Resources released on error paths"
domain = "ERR"
statement = "Files, locks, connections and similar resources are released on every exit path including failures, using scope-bound cleanup constructs."
rationale = "A resource that is freed only on the success path leaks under exactly the conditions where the system is already stressed."
evidence_tiers = ["V1", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Tie release to scope exit with RAII, defer, finally, a context manager or using, rather than to the happy path of the code."
related = ["ERR-010"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-008"
title = "Error branches covered by tests"
domain = "ERR"
statement = "The paths that handle failures are exercised by tests, for example through injected faults, coverage of the branches that handle failures, or mutation of failure handling."
rationale = "Failure handling is the least-run code in a system, so untested it tends to fail precisely when it is first needed."
evidence_tiers = ["V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = true
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Add tests that force each important failure and assert the resulting behavior, using a fault-injection helper where the failure is hard to trigger."
related = ["TST-002"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "ERR-009"
title = "Errors and logs leak no sensitive data"
domain = "ERR"
statement = "Error messages and log output must not carry secrets, credentials, personal data or other sensitive values."
rationale = "Messages travel to log stores, dashboards and users, so anything placed in them is exposed far beyond its original trust boundary."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "low"
kb_refs = []
remediation = "Redact or omit sensitive fields when building messages, log identifiers instead of values, and keep internal detail out of anything shown to callers."
related = ["ERR-005"]
checked_today = "Tracked Rust files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) and test functions skipped; the tokens of each macro are read directly. ERR-009 reads error-message macros: anyhow!, bail!, ensure! (not its condition), eyre!, format_err!, panic!, a format! inside Err(..), .context(..), .with_context(..), .map_err(..), .ok_or(..), .ok_or_else(..) or .expect(..), and write!, writeln! or format! inside the Display impl of a type whose name ends in Error or Err. A name is sensitive when its last word is password, passwd, passphrase, secret, token, credential(s), cookie, authorization, bearer or apikey, or its last two words are api_key, private_key, secret_key, signing_key, access_key, session_key, auth_key, master_key or encryption_key (token_count, token_type and tokenizer are not); it counts as a variable, field, tracing named field or inline format capture, not as the receiver of len or is_empty, a call, a redacted argument or a field given a literal. Not judged: a secret behind a name that does not say so, a {:?} of a whole struct that holds one, a self-redacting type, a record or error built by a wrapper, other languages. One High finding with Low confidence per macro and name; opt-in (check ERR-009)."
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "ERR-010"
title = "Compound state changes say whether they are all-or-nothing"
domain = "ERR"
statement = "Operations that change several pieces of state in sequence should declare how they stay consistent if interrupted: a transaction, a rollback, or a compensating step."
rationale = "A failure midway through a multi-step update leaves a half-applied state that no single component owns or can detect."
evidence_tiers = ["V4", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Wrap the sequence in a transaction, or write down and implement the compensation that undoes completed steps; confirm with a crash-injection test."
related = ["ERR-007"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "ERR-011"
title = "Non-throwing parse results are checked"
domain = "ERR"
statement = "Parsing calls that signal failure through a return value, such as a try-parse form or an optional result, must have that signal tested before the value is used."
rationale = "These APIs avoid exceptions, so skipping the check yields a default or empty value that silently flows onward as if it were real data."
evidence_tiers = ["V0", "V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Branch on the success flag or the presence of the value, and handle the failure case explicitly."
related = ["ERR-001", "unused-return-values"]
lifecycle = "experimental"

