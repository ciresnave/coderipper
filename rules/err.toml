[[rule]]
id = "ERR-010"
title = "Compound state changes say whether they are all-or-nothing"
domain = "ERR"
statement = "Operations that change several pieces of state in sequence should declare how they stay consistent if interrupted: a transaction, a rollback, or a compensating step."
rationale = "A failure midway through a multi-step update leaves a half-applied state that no single component owns or can detect."
evidence_tiers = ["V4", "V2"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Wrap the sequence in a transaction, or write down and implement the compensation that undoes completed steps; confirm with a crash-injection test."
related = ["ERR-007"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "ERR-011"
title = "Non-throwing parse results are checked"
domain = "ERR"
statement = "Parsing calls that signal failure through a return value, such as a try-parse form or an optional result, must have that signal tested before the value is used."
rationale = "These APIs avoid exceptions, so skipping the check yields a default or empty value that silently flows onward as if it were real data."
evidence_tiers = ["V0", "V1"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "medium"
kb_refs = []
remediation = "Branch on the success flag or the presence of the value, and handle the failure case explicitly."
related = ["ERR-001", "ERR-012"]
lifecycle = "experimental"

checked_today = "Rust only (the catalog also names TypeScript and Python, which are not read): tracked .rs files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) and test functions skipped. A parse whose failure is replaced on the spot by a value is reported: x.parse() with no arguments (any turbofish), or T::from_str(x), optionally followed by .ok(), then .unwrap_or_default(), .unwrap_or(..) or .unwrap_or_else(..). One Medium finding with Medium confidence per site; opt-in (check ERR-011). A comment on the line, or in the comment block directly above it, that says why (default, fall back, fallback, lenient, best effort, on purpose, deliberate, intentional) silences the site. Not judged: the receiver type (syn has no types: a zero-argument parse is read as str::parse), a parse that is ok()-ed and tested later, a parse wrapped in a function of the project, a default that is the right answer, other languages."

