# Rule records, domain SEC (security). Informed by the owner's knowledge base v2; written in CodeRipper's own words.

[[rule]]
id = "SEC-001"
title = "No unsanitised taint flow to dangerous sinks"
domain = "SEC"
statement = "Data from untrusted sources must not reach sensitive operations such as queries, shell commands, file paths, outbound requests or deserialisers without being validated or encoded first."
rationale = "Injection, path traversal, request forgery and unsafe deserialisation all come from the same cause: attacker-supplied data passing a trust boundary without inspection."
evidence_tiers = ["V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Parse and validate input at the boundary, use parameterised queries and argument lists instead of strings, canonicalise paths, restrict outbound destinations, and never rebuild attacker-supplied payloads as arbitrary class hierarchies."
related = ["SEC-008"]
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "SEC-002"
title = "No committed secrets"
domain = "SEC"
statement = "Credentials, tokens and keys do not appear in tracked files or anywhere in the repository history."
rationale = "A committed secret is exposed to everyone with read access, forever, and is routinely harvested by automated scanners."
evidence_tiers = ["V0", "V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "repository"
executes_project_code = false
default_severity = "critical"
confidence_class = "high"
kb_refs = []
remediation = "Revoke and rotate any exposed secret, move values into a secret store or environment, and run a secret scanner in pre-commit and in CI, including over history."
related = ["SEC-008"]
lifecycle = "experimental"

checked_today = "The whole git history of the repository (gitleaks git: every commit, so a secret committed and later deleted is still reported) is scanned by gitleaks with its default rule set at the pinned version, run with --redact (the value is never read into CodeRipper) and with no gitleaks:allow comment, .gitleaksignore or .gitleaks.toml of the repository honoured. One finding per gitleaks match at the file and line, subject the file, High severity; Medium confidence, Low for gitleaks's generic-api-key rule (entropy near a name, the one that fires on non-secrets). A project in a subdirectory of a repository keeps only the matches below it. Runs in the extended profile only (not in classic or portfolio). Not run (a reported gap, never clean): gitleaks not installed or no pinned build for the platform, and an empty report on a shallow clone (only the fetched commits were read). Errors, never clean: no git commit, a gitleaks log showing the history was not read (git errors, 0 commits scanned), a tool failure. Not judged: a secret in a format gitleaks's default rules do not know, a secret that is not in a commit (an untracked or uncommitted file, a build log, an environment), and a project outside git."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "SEC-003"
title = "Authorization on every entry point"
domain = "SEC"
statement = "Every externally reachable handler enforces access control, preferably through default-deny middleware, and object-level and tenant checks are present where data belongs to a user or tenant."
rationale = "Missing or inconsistent authorization is among the most common serious weaknesses, and it is invisible to scanners that only look for dangerous calls."
evidence_tiers = ["V1", "V4"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "low"
kb_refs = []
remediation = "List every route, join the list to the enforced policy, centralise the checks in one deny-by-default layer and add object-level ownership checks; have a reviewer look at the semantic cases."
related = ["SEC-007", "SEC-010"]
lifecycle = "experimental"

[rule.applicability]
languages = ["typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "SEC-004"
title = "No cryptography misuse"
domain = "SEC"
statement = "Encryption, hashing and random-number code only looks protective if it uses a discouraged algorithm or mode, embeds a fixed key or initialisation vector, draws security values from an ordinary generator, or skips verification of the peer's certificate."
rationale = "Cryptographic mistakes silently remove the protection the code is supposed to provide while still appearing to work."
evidence_tiers = ["V0", "V1"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "high"
confidence_class = "medium"
kb_refs = []
remediation = "Use a vetted library's high-level API, a cryptographically secure random source, a modern password hash, keys from a secret store, and leave certificate validation switched on."
related = ["SEC-002"]
lifecycle = "experimental"

checked_today = "Tracked Rust files outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) or test skipped: a call to from_secret, new_from_slice, Key::from_slice, hmac::Key::new or UnboundKey::new whose key argument is a non-empty string or byte literal, an array of integer literals, or a local bound to one earlier in the same function (High); danger_accept_invalid_certs or danger_accept_invalid_hostnames unless the argument is the literal false, and a rustls .dangerous() with no arguments (High; a non-literal argument is Medium confidence and says to check the default). One finding per site. Not judged: weak algorithms, AEAD without associated data, non-constant-time comparison, a key built from concat!, a const, a static, a helper or the environment, a custom certificate verifier, TypeScript and Python."

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "SEC-005"
title = "Unsafe and native code inventory"
domain = "SEC"
statement = "Uses of unsafe or native code are counted, kept to a minimum and each justified; crates that need none can forbid it outright."
rationale = "Memory-unsafe code is where a large share of severe vulnerabilities originate, so confining it makes review and auditing tractable."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "low"
confidence_class = "high"
kb_refs = []
remediation = "Forbid unsafe code where possible, otherwise isolate it in a small module with a written safety argument and track the count over time."
related = ["SEC-010"]
checked_today = "Tracked Rust files of each package (nearest Cargo.toml), outside vendored, fixture and development directories (tests, benches, examples, tools, scripts, build.rs, tests.rs-style files), parsed with syn, items under cfg(test) skipped: unsafe blocks, unsafe fns, and unsafe impl and trait items are counted. One Info finding per package when an unsafe block or unsafe impl has no SAFETY comment on its line or in the comment lines directly above it (the count and the sites are in the finding), or when a package with no unsafe neither forbids nor denies unsafe_code in a lib.rs or main.rs or under lints in a Cargo.toml. A package whose unsafe is all justified, or that forbids it, says nothing. Not judged: unsafe inside macro arguments or generated code, native code in another language, whether a SAFETY comment is true, TypeScript and Python, and COR-006 (this inventory is its static half but does not claim it)."
lifecycle = "experimental"

[rule.applicability]
languages = ["rust", "typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "SEC-006"
title = "No known exploitable dependency vulnerabilities"
domain = "SEC"
statement = "No dependency has a known, exploitable vulnerability unless each remaining one has a recorded waiver."
rationale = "Shipped code is mostly third-party, and published advisories make known weaknesses easy for attackers to find and use."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "network"
unit = "repository"
executes_project_code = false
default_severity = "high"
confidence_class = "high"
kb_refs = []
remediation = "Match the lockfile against an advisory database, upgrade or replace the affected dependency, and record a dated waiver with a reason for anything you must keep."
related = ["SUP-002"]
lifecycle = "experimental"
checked_today = "The advisory groups that SUP-002 finds, narrowed to those with a CVSS score of 7.0 or higher or no score: a known advisory of high or unknown severity covers a resolved dependency version in the OSV database. Not judged: whether the vulnerable code is reachable or exploitable (call analysis is not run, so no finding claims the project can be attacked through it), and waivers."

[rule.applicability]
languages = ["any"]
scopes = ["third_party"]

[[rule]]
id = "SEC-007"
title = "A current threat model"
domain = "SEC"
statement = "A threat model exists, is kept up to date, maps threats to controls, and a change to trust boundaries (new endpoint, integration or data store) triggers a review."
rationale = "Declaring trust boundaries is the starting point for every other security decision, and an out-of-date model gives false comfort."
evidence_tiers = ["V5", "V4"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "repository"
executes_project_code = false
default_severity = "low"
confidence_class = "low"
kb_refs = []
remediation = "Keep a threat model in the repository, review it whenever the diff adds endpoints or external calls, and link each threat to the control that addresses it."
related = ["SEC-003", "SEC-010"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "SEC-008"
title = "No sensitive data in logs or telemetry"
domain = "SEC"
statement = "Personal data and secrets are kept out of log lines, error messages and telemetry."
rationale = "Logs are copied widely and kept long, so anything written to them is exposed to far more people than the original data was."
evidence_tiers = ["V1", "V4"]
evidence_strength = "C"
contested = false
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "medium"
confidence_class = "low"
kb_refs = []
remediation = "Redact or omit sensitive fields before logging, wrap secrets in types that print as masked, and review log statements that handle user records."
related = ["SEC-001", "SEC-002"]
lifecycle = "experimental"

[rule.applicability]
languages = ["typescript", "python"]
scopes = ["first_party"]

[[rule]]
id = "SEC-009"
title = "Least privilege in infrastructure definitions"
domain = "SEC"
statement = "Wildcard permissions and elevated container privileges let a single breach spread through the whole environment, so infrastructure definitions should grant each workload only the named actions and resources it needs."
rationale = "Over-broad grants turn any single compromise into a compromise of the whole environment."
evidence_tiers = ["V0"]
evidence_strength = "E"
contested = false
scope = "project"
network = "local"
unit = "repository"
executes_project_code = false
default_severity = "high"
confidence_class = "high"
kb_refs = []
remediation = "Narrow policies to named actions and resources, drop container privileges and capabilities, and scan the definitions with a policy tool in CI."
related = ["REL-005"]
lifecycle = "experimental"

checked_today = "The tracked infrastructure files (from git ls-files, up to 2 MiB; not below node_modules, vendor, third_party, target, .git or the top-level .github): Terraform (.tf, .tf.json), Dockerfiles, and .yaml, .yml, .json, .template and .bicep files other than package.json, package-lock.json, composer.json, composer.lock, tsconfig.json, deno.json, renovate.json, dependabot.yml and dependabot.yaml, codecov.yml and mkdocs.yml, are given to checkov, run offline in its terraform, cloudformation, kubernetes, dockerfile, arm, bicep and serverless frameworks and asked for 37 named checks only: wildcard and administrator grants (AWS IAM, GCP, Kubernetes RBAC), privilege escalation, privileged containers and shared host namespaces (High), root containers and added Linux capabilities (Medium). The list holds AWS, GCP, Kubernetes and Dockerfile checks, so ARM, Bicep and other Azure definitions are read but no listed check targets them. The repository's own checkov configuration is not read. One finding per failed check at the first line of the resource, High confidence. A #checkov:skip comment is not honoured: a skipped check of this list is still reported and the finding says so. Runs in the extended profile only. Not run (a reported gap, never clean): checkov not installed or no pinned build for the platform (none for Apple silicon), no tracked infrastructure file, and a clean result when checkov could not parse a file. A tool failure or a report that is not checkov's is an error. Not judged: the rest of checkov's checks (encryption, logging, versioning, network exposure), Helm and Kustomize (those frameworks are not enabled), Terraform modules from outside the repository (downloads are off), live cloud or cluster configuration, and least privilege expressed anywhere but these definitions."

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]

[[rule]]
id = "SEC-010"
title = "Model-assisted review of risky changes"
domain = "SEC"
statement = "Changes that touch authentication, authorization, cryptography or parsing receive an extra review pass by a language-model reviewer, with a human confirming every finding."
rationale = "Logic flaws and authorization gaps escape pattern-based scanners; a model can raise candidates, but only evidence-backed and human-confirmed ones should count."
evidence_tiers = ["V4", "V5"]
evidence_strength = "C"
contested = true
scope = "project"
network = "local"
unit = "package"
executes_project_code = false
default_severity = "info"
confidence_class = "low"
kb_refs = []
remediation = "Route high-risk diffs to the model reviewer, require each finding to cite the code it concerns, and never let the model be the sole gate."
related = ["SEC-003", "SEC-007"]
lifecycle = "experimental"

[rule.applicability]
languages = ["any"]
scopes = ["first_party"]
