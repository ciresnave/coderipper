# Coverage is a signal, not a gate (agreed with CireSnave 2026-10-03). Codecov's
# statuses are informational: they report, and never fail. There is no target
# and no threshold. What the number does and does not cover is written in
# .github/workflows/coverage.yml.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The conformance fixtures are seeded defects and their clean twins, run as projects of their own by `coderipper conformance`;
# the two directories named `vendor` are fixture content for SUP-011, not code this repository vendors.
ignore:
  - "conformance/SUP-011/clean/vendor"
  - "conformance/SUP-011/defective/vendor"
