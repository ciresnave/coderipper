# CodeRipper's own run on itself (`coderipper fast --deny medium`, the `coderipper` job of ci.yml). No finding is waived here: the
# one entry declares a public entry point, and is still printed with its reason.

[reachability]
public_api = [
  { file = "src/lib.rs", symbol = "run_checks_in", reason = "The library's public entry point for a run under a profile (documented, in the semver promise); its callers are other programs, which a project-scope check cannot see." },
]

# SEC-002 reads git history, and two commits in it hold a placeholder that gitleaks takes for a secret. HEAD no longer holds either
# literal; the waiver stays only because the commits do. Owner: the coderipper lane. Remove when the history is rewritten or the
# commits age out of the scanned window.
[[allow]]
check = "SEC-002"
file = "src/module/delegate/gitleaks.rs"
reason = "history only: commit 24cb9f1a holds an AWS-key-shaped placeholder in a test (not a credential); HEAD builds it at run time. Owner: coderipper lane. Remove when history is rewritten or the commit ages out."

[[allow]]
check = "SEC-002"
file = "src/redact.rs"
reason = "history only: commit f8c78dbe holds a doc comment naming the private-key BEGIN/END markers on one line (no key body); HEAD words it differently. Owner: coderipper lane. Remove when history is rewritten or the commit ages out."

# MOD-005 (size and coupling outliers, advisory) reports two files of this repository. Each is waived here with its reason; nothing is excluded by path.
[[allow]]
check = "MOD-005"
file = "src/cli.rs"
reason = "a real candidate, not a false alarm: 1,439 code lines holding the argument definitions, dispatch, the tools/cache/conformance subcommands, report printing and the cargo-subcommand shim, and `run_and_report` alone is about 437 lines. It should become a cli/ module split (args, report, one file per subcommand). Not done in the change that introduced the rule, to keep that change reviewable. Owner: coderipper lane. Remove this entry when the file is split or falls under 1,035 code lines."
[[allow]]
check = "MOD-005"
file = "src/module/neutral/mod.rs"
reason = "the registry of the language-neutral rules: one `mod` declaration and one entry per rule module, so the number of modules it names (21) is the number of rules by construction, not accidental coupling. Owner: coderipper lane. Revisit if it starts to hold logic of its own."

# MOD-002 (cycles between modules, advisory) reports two sets in this repository. Each is waived here with its reason; nothing is excluded by path.
[[allow]]
check = "MOD-002"
file = "src/allowlist.rs"
symbol = "allowlist,architecture,config"
reason = "a real cycle, not a false alarm: `config` holds the parsed shape of the repository file, whose sections are types owned by `allowlist` and `architecture`, and the `load` functions of those two modules read the file through `config::read_file`. Splitting the types from the readers (a `config::schema` module, or moving the two loaders into `config`) removes it; not done in the change that introduced the rule, to keep that change reviewable. Owner: coderipper lane. Remove this entry when the loaders or the types move."
[[allow]]
check = "MOD-002"
file = "src/session.rs"
symbol = "session,worktree"
reason = "a real cycle, one concept in two files: `session` creates a throwaway worktree (`worktree::run_worktree_add`) and `worktree` holds the session's inner state (`session::SessionInner`) while it runs. The worktree functions taking the data they need instead of the inner state removes it; not done in the change that introduced the rule. Owner: coderipper lane. Remove this entry when `worktree` no longer names `session`."

# MOD-005 (size and coupling outliers, advisory): the registry of the architecture-family checks.
[[allow]]
check = "MOD-005"
file = "src/checks/architecture/mod.rs"
reason = "the registry of the architecture-family checks (ARC-001 to ARC-007, MOD-001 to MOD-003, MOD-008, MOD-010 and their shared module graph): one `mod` declaration and one `pub use` per check, so the number of modules it names is the number of checks by construction, not accidental coupling (it reached the threshold of 14 when MOD-008 was added). Owner: coderipper lane. Revisit if it starts to hold logic beyond the ARC-001 component graph it also contains, or when the family is split into sub-directories."
