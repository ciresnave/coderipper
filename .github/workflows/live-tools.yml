name: Live tools

# Runs the delegated rules against the real tools and the live advisory database. Not a required check: a failure here is a
# signal (a new advisory against the canary package, or osv.dev / a tool changed), not a merge block. Pull requests run the same
# tests without the canary, whose answer depends on the day.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# the token gets read access to the repository and nothing else; a job that needs more raises it for itself
permissions:
  contents: read

jobs:
  live:
    name: Delegated rules against the real tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Run the delegated-rule tests, including the live-database canary
        run: cargo test --test delegated_osv --test delegated_gitleaks --test delegated_lychee -- --include-ignored
