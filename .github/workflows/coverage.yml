name: Coverage

# A signal, not a gate: this workflow is not a required check and has no threshold. It runs the same tests
# as CI under cargo-llvm-cov and uploads the lcov report to Codecov. The "Build, test, clippy, fmt" jobs in
# ci.yml are untouched.
#
# What the number covers: lines of `src/` executed by `cargo test` (unit tests and every integration-test binary) on
# ubuntu only. It does not cover code that only runs on Windows or macOS, and "executed" is not "verified": a line
# can be run by a test that asserts nothing about it. Codecov's PR statuses are informational (see codecov.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# the token gets read access to the repository and nothing else; a job that needs more raises it for itself
permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (llvm-cov, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --no-fail-fast --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Never turns the build red: a missing token (fork PR) or a Codecov outage is not a test failure.
          fail_ci_if_error: false
