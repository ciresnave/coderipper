name: Coverage

# A signal, not a gate: this workflow is not a required check and has no threshold. It runs the same tests
# as CI under cargo-llvm-cov and uploads the lcov report to Codecov. The "Build, test, clippy, fmt" jobs in
# ci.yml are untouched.
#
# What the number covers: lines of `src/` executed by `cargo test` (unit tests and every integration-test binary) on
# ubuntu only. It does not cover code that only runs on Windows or macOS, and "executed" is not "verified": a line
# can be run by a test that asserts nothing about it. Codecov's PR statuses are informational (see codecov.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (llvm-cov, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --no-fail-fast --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Never turns the build red: a missing token (fork PR) or a Codecov outage is not a test failure.
          fail_ci_if_error: false
