name: Portfolio checks

# The one check set every repository of the portfolio runs per pull request (docs/portfolio-ci-coverage.md section 2). A caller writes
#
#   jobs:
#     portfolio:
#       permissions:
#         contents: read
#       uses: ciresnave/coderipper/.github/workflows/portfolio.yml@<40-hex SHA of a commit on main>
#
# and passes nothing else but, for a private repository, `with: runs-on: <self-hosted label>`. The rule list is fixed by the `portfolio`
# profile and the CodeRipper version by `CODERIPPER_VERSION` below, so a caller can no more drift by editing its own workflow than
# override either; bumping the version is a change to this file, which callers pick up by moving their SHA.
#
# The run builds the caller's crate (reachability compiles it, so a `build.rs` executes), hence the first step: a pull request from a
# fork, or a `pull_request_target` run, is refused on any runner that is not a GitHub-hosted one.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label; a private repository passes its self-hosted label.
        type: string
        default: ubuntu-latest

# the token gets read access to the repository and nothing else; no secret is declared, so none can be passed
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Portfolio runs never use a compiler wrapper. A self-hosted runner can inherit another user's `RUSTC_WRAPPER` (sccache) that the
  # runner account cannot execute, which fails `cargo install` before it compiles anything; an empty value turns it off (harmless on
  # a hosted runner).
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
  # The least free space on `/` (GB) the job starts a build with, checked after the cleanup and again before the sweep. A floor CHOSEN, not
  # measured: the run that motivated it (synapse#290, run 41007729285) died at zero free ("No space left on device") while building three
  # workspace members and installing gitleaks, and its log does not say how much it began with. Raise it if a repository's build needs more.
  MIN_FREE_GB: 8
  # The published release the sweep installs: THE NEWEST ONE on crates.io. It was left at 0.9.6 while 0.9.7 to 0.9.14 were published, and no workflow SHA
  # could reach those fixes. `tests/portfolio_version.rs` keeps it from drifting (offline: well formed, not ahead of Cargo.toml; online, in the scheduled
  # `release-drift.yml`: equal to the newest published version). Bump it in the change that follows each publish, then repin the callers.
  CODERIPPER_VERSION: 0.10.0

jobs:
  portfolio:
    name: Portfolio checks (coderipper sweep --profile portfolio)
    runs-on: ${{ inputs.runs-on }}
    # every step is Bash, whatever the runner: a Windows runner defaults to PowerShell
    defaults:
      run:
        shell: bash
    steps:
      # On Windows, `shell: bash` finds the first `bash` on PATH, and on a machine with WSL that is C:\WINDOWS\system32\bash.exe, the WSL
      # launcher ("no installed distributions"). Put Git for Windows' bash first for every later step; the step itself runs in Windows
      # PowerShell, which every Windows runner has, so it needs no bash. Not a literal `shell:` path: `shell:` takes no expression, and
      # a literal would break the Linux and macOS runners.
      - name: Use Git for Windows' bash
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @()
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) { $candidates += (Join-Path (Split-Path (Split-Path $git.Source)) 'bin') }
          $candidates += 'C:\Program Files\Git\bin'
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir 'bash.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              Write-Output "bash: $dir\bash.exe"
              exit 0
            }
          }
          Write-Output "::error::Git for Windows' bash.exe was not found (looked beside git.exe and in C:\Program Files\Git\bin); install Git for Windows on this runner"
          exit 1
      - name: Refuse untrusted code on a runner that is not GitHub-hosted
        env:
          RUNS_ON: ${{ inputs.runs-on }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if { [ "$FORK" = true ] || [ "$EVENT" = pull_request_target ]; } && ! printf '%s' "$RUNS_ON" | grep -Eq '^(ubuntu|windows|macos)-'; then
            echo "::error::runs-on '$RUNS_ON' is not a GitHub-hosted runner and this run is for code from a fork; it would execute that code (build.rs) on your machine"
            exit 1
          fi
      # A GitHub-hosted Linux image ships toolchains this job never uses (.NET, the Android SDK, GHC, CodeQL, Boost, Swift) and a Docker image
      # cache. A workspace build plus the build cache fills what is left (synapse#290: three members failed to build with "failed to write", the
      # gitleaks download with "No space left on device", and SEC-002 never ran). Remove them first, say how much that freed, and fail by name
      # if the disk is still under the floor, rather than letting the build die later with a bare write error.
      - name: Free disk space (GitHub-hosted Linux runners)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          avail_kb() { df --output=avail -k / | awk 'NR==2 {print $1}'; }
          before="$(avail_kb)"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          after="$(avail_kb)"
          df -h /
          echo "freed $(( (after - before) / 1048576 )) GB; $(( after / 1048576 )) GB free (floor $MIN_FREE_GB GB)"
          if [ "$(( after / 1048576 ))" -lt "$MIN_FREE_GB" ]; then
            echo "::error::disk: only $(( after / 1048576 )) GB free on / after removing the unused toolchains; the job needs at least $MIN_FREE_GB GB for the build cache, the target directory and the tools"
            exit 1
          fi
      # the whole history: version-and-changelog compares against the base ref and SEC-002 reads the history, and a shallow clone makes
      # either say "not run"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The analysis compiles the caller's crates, so a build script that needs `protoc` (prost-build; mlmf's) must find it. Only on a
      # GitHub-hosted Linux runner, where installing a package is routine; a self-hosted runner is the owner's machine and is left alone.
      # A crate whose build still fails is named as not judged, not reported clean.
      # Log only: where the disk goes on a hosted runner (Fuel's job ran out, and the build-cache size measured elsewhere does not explain it). No
      # step reads these numbers; `|| true` keeps a missing path from failing the job.
      - name: Disk use before the install (log only)
        run: |
          df -h / || true
          du -sm "$RUNNER_TEMP/coderipper-build" "$HOME/.cargo" "$HOME/.cache/coderipper-bin" 2>/dev/null || true
      - name: Install protoc (GitHub-hosted Linux runners)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # The release is built once per machine and version, not once per run, and never into `~/.cargo/bin`: parallel runs on one self-hosted
      # runner share that directory, and a running `coderipper.exe` cannot be replaced ("Access is denied", Humboldt#131). Each run builds
      # into its own `--root` under `RUNNER_TEMP`; the finished tree is then published to a version-keyed cache directory by a rename, so two
      # runs that race both end with a complete copy (the loser discards its own), and a half-written tree is never visible. A cached
      # binary is used only if `--version` reports exactly this release. A GitHub-hosted runner starts empty, so the directory is kept
      # between runs by the two cache steps around this one; a self-hosted runner simply keeps it.
      - name: Restore the CodeRipper binary cache (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        id: bin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/coderipper-bin
          key: coderipper-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.CODERIPPER_VERSION }}
      - name: Install coderipper from crates.io
        run: |
          cache_root="${CODERIPPER_BIN_CACHE:-$HOME/.cache/coderipper-bin}"
          cache="$cache_root/$CODERIPPER_VERSION-$RUNNER_OS-$RUNNER_ARCH"
          exe=coderipper
          if [ "$RUNNER_OS" = Windows ]; then exe=coderipper.exe; fi
          # usable <dir>: the binary exists and is exactly this release (a partial or foreign copy is not used)
          usable() { [ -x "$1/bin/$exe" ] && "$1/bin/$exe" --version 2>/dev/null | grep -qF "$CODERIPPER_VERSION"; }
          if usable "$cache"; then
            echo "using the cached coderipper $CODERIPPER_VERSION at $cache"
            bin="$cache/bin"
          else
            build="$RUNNER_TEMP/coderipper-build"
            rm -rf "$build"
            cargo install coderipper --version "$CODERIPPER_VERSION" --locked --root "$build"
            bin="$build/bin"
            mkdir -p "$cache_root"
            staging="$cache.new.$$"
            rm -rf "$staging"
            # an existing copy that is not this release is damaged (the directory is keyed by version): clear it
            if [ -e "$cache" ] && ! usable "$cache"; then rm -rf "$cache" 2>/dev/null || true; fi
            if cp -R "$build" "$staging"; then
              # another run may have published first: keep its copy and drop ours; never write over a binary that may be running
              if [ ! -e "$cache" ]; then mv "$staging" "$cache" 2>/dev/null || true; fi
              # a rename that lost the race moved ours INTO the winner's directory: take it back out
              rm -rf "$cache/$(basename "$staging")" "$staging"
              if usable "$cache"; then bin="$cache/bin"; fi
            fi
          fi
          echo "$bin" >> "$GITHUB_PATH"
      # Positive control: what is on PATH is the release this file names. A caller pinned a workflow SHA that installed 0.9.20 while its
      # `CODERIPPER_VERSION` said 0.9.24; the install step's own check only decides whether a cached copy is reused.
      - name: The installed coderipper is the pinned release
        run: |
          got="$(coderipper --version)"
          echo "installed: $got; CODERIPPER_VERSION: $CODERIPPER_VERSION"
          if [ "$got" != "coderipper $CODERIPPER_VERSION" ]; then echo "::error::the coderipper on PATH is '$got', not the pinned $CODERIPPER_VERSION"; exit 1; fi
      - name: Save the CodeRipper binary cache (GitHub-hosted runners)
        if: always() && runner.environment == 'github-hosted' && steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/coderipper-bin
          key: coderipper-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.CODERIPPER_VERSION }}
      # `--no-config`: the runner's own configuration files do not decide the result; the repository's `.coderipper.toml` still does
      # (`[[allow]]` entries carry a reason and an owner and are reviewed in the pull request that adds them).
      # `ci-protection-presence` reads branch protection, which this job's token cannot see; the PM's sweep runs it.
      # The `portfolio` profile holds the language-neutral rules only, so the secrets scan (SEC-002, delegated to gitleaks) is its own
      # step, with the tool downloaded: without `--install-tools` a missing tool is a gap and the job would pass without having looked.
      # The analysis builds the caller's crate (and every member of a workspace) in CodeRipper's own build cache. A GitHub-hosted runner
      # starts empty, so that cache is kept between runs, keyed on the lockfiles; a self-hosted runner keeps its own cache directory and needs
      # none of this. Restore and save are separate steps so the cache is saved even when the sweep fails on a finding.
      - name: Restore the build cache (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coderipper-build
          key: coderipper-build-${{ runner.os }}-${{ env.CODERIPPER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            coderipper-build-${{ runner.os }}-${{ env.CODERIPPER_VERSION }}-
      - name: Point CodeRipper's build cache at it (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: echo "CODERIPPER_CACHE_DIR=$RUNNER_TEMP/coderipper-build" >> "$GITHUB_ENV"
      - name: Enough free disk for the sweep
        if: runner.os == 'Linux'
        run: |
          free_gb="$(( $(df --output=avail -k / | awk 'NR==2 {print $1}') / 1048576 ))"
          echo "$free_gb GB free on / (floor $MIN_FREE_GB GB)"
          if [ "$free_gb" -lt "$MIN_FREE_GB" ]; then
            echo "::error::disk: only $free_gb GB free on / before the sweep (after the install and the cache restores); the sweep would fail with a write error, so it is not started"
            exit 1
          fi
      - name: coderipper sweep --profile portfolio, and the secrets scan
        # `DOCS_RS=1`: a build script that honours it (the docs.rs convention) skips its native or CUDA toolchain, so a crate that needs nvcc
        # or a vendor SDK still compiles on a hosted runner. The analysis is then STATIC ONLY: it reads the source, it does not prove the
        # native part builds. A member whose build still fails is named in the output as not judged, and the job fails on it.
        env:
          DOCS_RS: "1"
        run: |
          code=0
          secrets_code=0
          # A cargo workspace is analysed member by member: `--project .` on a virtual workspace root runs none of the Rust checks (each
          # errors, "not a package directory"), and on a root package that also has members it skips the members.
          ws=""
          if [ -f Cargo.toml ] && grep -q '^[[]workspace]' Cargo.toml; then ws=--workspace; fi
          coderipper sweep --profile portfolio --deny medium --no-config $ws --skip-rule "ci-protection-presence=needs repository-admin read, which this job's token lacks; the PM sweep runs it" --project . 2> "$RUNNER_TEMP/sweep.stderr" || code=$?
          coderipper check SEC-002 --profile extended --install-tools --deny medium --no-config --project . 2>> "$RUNNER_TEMP/sweep.stderr" || secrets_code=$?
          if [ "$secrets_code" -gt "$code" ]; then code="$secrets_code"; fi
          cat "$RUNNER_TEMP/sweep.stderr" >&2
          # A check that could not run, and a tool that could not be installed, are named in the job's annotations (the first ten of each), not
          # left as one line among thousands: the run that motivated this showed only "Process completed with exit code 3".
          failed=0
          if grep -E '^coderipper: check error: .* failed to run' "$RUNNER_TEMP/sweep.stderr" > "$RUNNER_TEMP/check-errors.txt"; then
            awk 'NR <= 10 { sub(/^coderipper: check error: /, ""); print "::error::" $0 }' "$RUNNER_TEMP/check-errors.txt"
            failed=1
          fi
          if grep -E 'tool_install_failed|tool_missing|tool_unavailable_for_platform|checksum_mismatch|download_failed|archive_refused|consent_not_given' "$RUNNER_TEMP/sweep.stderr" > "$RUNNER_TEMP/tool-errors.txt"; then
            awk 'NR <= 10 { sub(/^coderipper: (check error|note): /, ""); print "::error::a tool the secrets scan needs was not installed: " $0 }' "$RUNNER_TEMP/tool-errors.txt"
            failed=1
          fi
          # A rule that did not run is a note, never an exit code: fail the job on any that did not, except the Rust-only rules in a
          # repository with no Rust crate (nothing to look at), the rule this step skips on purpose, and the two rules that compare
          # a branch with its base (the lint-suppression ratchet, version-and-changelog) on a run of the default branch, where there
          # is no base to compare with (their note ends "a run on the default branch").
          if grep '^coderipper: note:.* not run:' "$RUNNER_TEMP/sweep.stderr" | grep -v -e 'no Rust crate at this path' -e 'skipped on request' -e 'a run on the default branch'; then echo "::error::a rule did not run (see the notes above)"; exit 1; fi
          if [ "$failed" -ne 0 ] && [ "$code" -eq 0 ]; then code=1; fi
          exit "$code"
      # Log only: where the disk goes on a hosted runner (Fuel's job ran out, and the build-cache size measured elsewhere does not explain it). No
      # step reads these numbers; `|| true` keeps a missing path from failing the job.
      - name: Disk use after the sweep (log only)
        if: always()
        run: |
          df -h / || true
          du -sm "$RUNNER_TEMP/coderipper-build" "$HOME/.cargo" "$HOME/.cache/coderipper-bin" 2>/dev/null || true
      - name: Save the build cache (GitHub-hosted runners)
        if: always() && runner.environment == 'github-hosted' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coderipper-build
          key: coderipper-build-${{ runner.os }}-${{ env.CODERIPPER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
