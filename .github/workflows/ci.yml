name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# the token gets read access to the repository and nothing else; a job that needs more raises it for itself
permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, clippy, fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked --all-targets

      - name: cargo test
        run: cargo test --locked --no-fail-fast

  # CodeRipper on itself, as every Rust repository of the portfolio is meant to run it (ROADMAP item 7). `--deny medium` fails the
  # job on a Medium or worse finding that no `[[allow]]` entry in `.coderipper.toml` waives; Low and Info are printed.
  coderipper:
    name: CodeRipper on its own source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: coderipper fast --deny medium
        run: cargo run --locked --quiet --bin coderipper -- fast --deny medium --project .

  # The whole of CodeRipper on itself: every rule of the extended profile, the delegated tools included, the findings of any
  # severity failing the job (`--deny info`). It is the run the portfolio PM measures, so it stays green. The history is fetched
  # (SEC-002 reads it, and says "not run" on a shallow clone); the tools are downloaded because without `--install-tools` a rule
  # whose tool is missing is a gap and the job would pass without having looked. Not a required check (yet).
  # `ci-protection-presence` is the one check left out: it reads branch protection, which the workflow token (`contents: read`) cannot
  # see and which a personal access token must not be given for. It runs in the PM's sweep, under an admin account (ROADMAP item 7).
  coderipper-sweep:
    name: CodeRipper sweep (extended, --deny info) on its own repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: coderipper sweep --profile extended --all-features --deny info
        run: |
          code=0
          cargo run --locked --quiet --bin coderipper -- sweep --profile extended --all-features --deny info --install-tools --skip-rule "ci-protection-presence=needs repository-admin read, which this job's token lacks; the PM sweep runs it" --project . 2> "$RUNNER_TEMP/sweep.stderr" || code=$?
          cat "$RUNNER_TEMP/sweep.stderr" >&2
          # A rule whose tool is unavailable is a note, never an exit code: fail the job on any whose tool is not available. Other notes stay notes: API-006 has no baseline without a changed .proto, and the fixtures note is information.
          if grep '^coderipper: note:.* not run:.* is not available' "$RUNNER_TEMP/sweep.stderr"; then echo "::error::a rule did not run (see the notes above)"; exit 1; fi
          exit "$code"

  # The portfolio check set, called as every repository of the portfolio calls it: the reusable workflow of this repository, pinned by the
  # SHA of a commit of `main` that holds it (the commit that merged it, so the pin is one the workflow itself did not need to know).
  portfolio:
    name: Portfolio checks
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@c0309d0139382e6938ff46f09198dc70bef3ab2d # 0.8.16

  # The jobs below are new with the library's first release. They are not (yet) required checks: only the matrix above is.
  docs:
    name: Docs build clean, library builds without the cli feature
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - name: cargo doc (a missing doc or a broken link fails)
        run: cargo doc --locked --no-deps
      - name: the library alone (no clap, no binaries)
        run: |
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo test --locked --no-default-features --lib
          cargo test --locked --no-default-features --doc
          cargo test --locked --no-default-features --test config_cli_only_keys

  msrv:
    name: Builds on the declared minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with `rust-version` in Cargo.toml (1.89 is where File::try_lock was stabilised).
      - uses: dtolnay/rust-toolchain@d77020bf130f2e8c39c025bf9c4c3a445fe2b9fa # 1.89
      - run: cargo build --all-targets --locked

  package:
    name: The published package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Packages the crate, then builds the packaged copy: a file the package leaves out that the build needs fails here.
      - run: cargo package --locked

  semver:
    name: Public API changes are matched by the version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Nothing is published to crates.io yet, so the baseline is the pull request's base commit.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  deny:
    name: Dependencies (cargo deny - advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
