[package]
name = "coderipper"
version = "0.2.13"
edition = "2021"
description = "Portfolio-wide code-integration auditor — dead-code/reachability, version consistency, dependency staleness, CI/protection presence, and more. Runs as a CLI (like clippy) or a server."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/coderipper"
readme = "README.md"
keywords = ["audit", "dead-code", "lint", "code-quality", "monorepo"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = ["cli"]
# The command-line program. A library user turns it off (`default-features = false`) and does not compile clap.
cli = ["dep:clap"]

[[bin]]
name = "coderipper"
path = "src/main.rs"
required-features = ["cli"]

# `cargo coderipper`: cargo runs any `cargo-<name>` on PATH as the subcommand `<name>`.
[[bin]]
name = "cargo-coderipper"
path = "src/cargo_main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "1"
tempfile = "3"
syn = { version = "3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
