[package]
name = "coderipper"
version = "0.3.1"
edition = "2021"
description = "Audits a Rust project for what clippy does not report: uncalled pub functions, discarded return values, unused parameters, version drift, missing CI protection. A library, a cargo subcommand and a CLI."
license = "MIT OR Apache-2.0"
# 1.89 is where `File::try_lock` (the build cache's advisory lock) was stabilised; CI builds with it.
rust-version = "1.89"
repository = "https://github.com/ciresnave/coderipper"
readme = "README.md"
keywords = ["audit", "dead-code", "lint", "code-quality", "monorepo"]
categories = ["development-tools", "command-line-utilities"]
# The package is the library, the two binaries and the examples. `tests/` is out because tests/fixtures holds nested
# Cargo.toml files, which cargo would treat as separate packages; `docs/` is the design history, not user documentation.
exclude = ["docs/", ".github/", "codecov.yml", "tests/"]

[features]
default = ["cli"]
# The command-line program. A library user turns it off (`default-features = false`) and does not compile clap.
cli = ["dep:clap"]

[[bin]]
name = "coderipper"
path = "src/main.rs"
required-features = ["cli"]

# `cargo coderipper`: cargo runs any `cargo-<name>` on PATH as the subcommand `<name>`.
[[bin]]
name = "cargo-coderipper"
path = "src/cargo_main.rs"
required-features = ["cli"]

# Its own harness: the test binary doubles as the fake external module (see the file's header).
[[test]]
name = "external_module"
harness = false

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "1"
tempfile = "3"
syn = { version = "3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
