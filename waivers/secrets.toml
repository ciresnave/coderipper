# SEC-002 reviewed waivers (docs/secret-waivers-design.md). This list ships inside the binary: a scanned repository can neither add
# nor edit an entry. An entry waives ONE gitleaks finding, named exactly by repo + commit + file + rule + line, and only a verified
# false positive: a real credential is rotated and the history rewritten, never waived. Reviewer is always "pm". `expires` is at most
# 365 days after `reviewed`; a renewal changes `reviewed` and `evidence`. A waived finding is reported as Info (visible, not
# silent); an expired entry or one that matches nothing in a history that holds its commit is reported as Medium.

